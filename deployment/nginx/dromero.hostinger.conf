server {
  listen 80;
  listen [::]:80;
  server_name your-domain.com www.your-domain.com;

  root /var/www/dromero-web;
  index index.html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Health endpoint for simple external checks.
  location = /health {
    add_header Content-Type text/plain;
    add_header Cache-Control no-store;
    return 200 'ok';
  }

  # Cache hashed Vite assets aggressively.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Prevent stale HTML from being cached.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
